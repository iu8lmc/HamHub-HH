name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: prove (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/test_hh.py

  build:
    name: eseguibile (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: HH-linux-x86_64
          - os: macos-latest
            artifact: HH-macos-arm64
          - os: windows-latest
            artifact: HH-windows-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-build.txt
      - run: python build.py
      - name: HH --version (Linux)
        if: runner.os == 'Linux'
        run: ./dist/HH --version
      - name: pacchetto Linux
        if: runner.os == 'Linux'
        run: tar czf ${{ matrix.artifact }}.tar.gz -C dist HH
      - name: pacchetto macOS
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/HH.app ${{ matrix.artifact }}.zip
      - name: pacchetto Windows
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist\HH.exe -DestinationPath ${{ matrix.artifact }}.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            HH-*.tar.gz
            HH-*.zip
